version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: slash_slice_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - slash_slice_net

  pubsub_emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: google_pubsub_emulator
    ports:
      - "8085:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    networks:
      - slash_slice_net

networks:
  slash_slice_net:
    driver: bridge

volumes:
  redis_data:
